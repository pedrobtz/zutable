# Mutation testing of the kernel's header (design-kernel section 8): Mull
# changes inst/include one operator at a time and the C tests of tests/c
# must notice. Reported, never gated: the survivors want reading. Slow, so
# on a schedule and on dispatch.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

name: mutation

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  mutation:
    uses: pedrobtz/r-actions/.github/workflows/mutation.yml@v1
    with:
      build: sh tools/ci/mutation-build.sh
      tests: build/mutation/test-groups
      include: |
        .*/inst/include/zutable/.*\.h
