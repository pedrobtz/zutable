# The kernel's own per-OS checks, one job per OS (r-actions platforms.yml):
# tools/ci/platform.sh compiles every header alone, runs the C tests and the
# fuzz target's smoke without R (under ASan and UBSan on Linux), and builds
# the consumer fixture, tools/zutabletest, against the installed header.
on:
  # No `push:`. A pull request already checks its merge with main, so the
  # push after merge would check the same tree again, in every package at
  # once. Main is checked by the schedule below, which skips a commit it has
  # already checked (README, "Pushes to main").
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: "41 1 * * 1"

name: platforms

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platforms:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:platforms'))
    uses: pedrobtz/r-actions/.github/workflows/platforms.yml@v1
    with:
      profile: auto
      # zufast's headers, which the kernel's include.
      r-dependencies: true
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
